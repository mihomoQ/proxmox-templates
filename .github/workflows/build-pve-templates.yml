name: Build PVE Cloud Templates

on:
  workflow_dispatch:
    inputs:
      install_docker:
        description: "common 档位是否安装 Docker CE 官方 APT 源版本"
        required: true
        type: boolean
        default: true
      install_speedtest:
        description: "common + Debian 13 是否添加 Ookla 源并安装 Speedtest CLI"
        required: true
        type: boolean
        default: true
      enable_bbr:
        description: "common 档位是否写入 TCP 调优和 BBR sysctl 配置"
        required: true
        type: boolean
        default: true
      publish_release:
        description: "是否发布到 GitHub Releases"
        required: true
        type: boolean
        default: true
      apply_updates:
        description: "是否在构建时执行系统更新"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pve-cloud-templates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-source:
    name: Download ${{ matrix.image_id }} source image
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      # 串行下载上游源镜像，避免同一次 workflow 对官方源造成并发压力。
      max-parallel: 1
      matrix:
        include:
          - image_id: debian12
          - image_id: debian13
          - image_id: ubuntu2204
          - image_id: ubuntu2404
          - image_id: ubuntu2604

    env:
      IMAGE_ID: ${{ matrix.image_id }}
      IMAGE_PROFILE: minimal
      WORKDIR: /tmp/pve-cloud-source/${{ matrix.image_id }}
      SRC_IMAGE: /tmp/pve-cloud-source/${{ matrix.image_id }}/${{ matrix.image_id }}-src.qcow2
      DOWNLOAD_ONLY: "true"
      INSTALL_HOST_TOOLS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install download tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            wget \
            ca-certificates

      - name: Download source image
        run: |
          chmod +x ./build-pve-cloud-image.sh
          ./build-pve-cloud-image.sh
          ls -lh "${SRC_IMAGE}"

      - name: Upload source image artifact
        uses: actions/upload-artifact@v6
        with:
          name: pve-source-${{ matrix.image_id }}
          path: /tmp/pve-cloud-source/${{ matrix.image_id }}/${{ matrix.image_id }}-src.qcow2
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    name: Build ${{ matrix.image_id }} ${{ matrix.image_profile }}
    needs: prepare-source
    # 固定 Ubuntu 22.04 runner，避免 ubuntu-latest 上 libguestfs/QEMU 网络栈变化影响构建。
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      # 源镜像已通过 artifact 复用；这里限制并发是为了控制 libguestfs/apt 负载。
      max-parallel: 3
      matrix:
        include:
          - image_id: debian12
            image_profile: minimal
            artifact_name: debian-12-pve-cloud-template
          - image_id: debian13
            image_profile: minimal
            artifact_name: debian-13-pve-cloud-template
          - image_id: ubuntu2204
            image_profile: minimal
            artifact_name: ubuntu-22.04-pve-cloud-template
          - image_id: ubuntu2404
            image_profile: minimal
            artifact_name: ubuntu-24.04-pve-cloud-template
          - image_id: ubuntu2604
            image_profile: minimal
            artifact_name: ubuntu-26.04-pve-cloud-template
          - image_id: debian12
            image_profile: common
            artifact_name: debian-12-pve-cloud-template
          - image_id: debian13
            image_profile: common
            artifact_name: debian-13-pve-cloud-template
          - image_id: ubuntu2204
            image_profile: common
            artifact_name: ubuntu-22.04-pve-cloud-template
          - image_id: ubuntu2404
            image_profile: common
            artifact_name: ubuntu-24.04-pve-cloud-template
          - image_id: ubuntu2604
            image_profile: common
            artifact_name: ubuntu-26.04-pve-cloud-template

    env:
      IMAGE_ID: ${{ matrix.image_id }}
      IMAGE_PROFILE: ${{ matrix.image_profile }}
      WORKDIR: /tmp/pve-cloud-build/${{ matrix.image_id }}-${{ matrix.image_profile }}
      SRC_IMAGE: /tmp/pve-cloud-build/${{ matrix.image_id }}-${{ matrix.image_profile }}/source/${{ matrix.image_id }}-src.qcow2
      INSTALL_DOCKER: ${{ inputs.install_docker }}
      INSTALL_SPEEDTEST: ${{ inputs.install_speedtest }}
      ENABLE_BBR: ${{ inputs.enable_bbr }}
      ROOT_PARTITION: "/dev/sda1"
      REMOVE_SNAPD: "true"
      APPLY_UPDATES: ${{ inputs.apply_updates }}
      CLEAN_DOCS: "true"
      CONFIGURE_FASTFETCH: "true"
      INSTALL_HOST_TOOLS: "false"
      LIBGUESTFS_BACKEND: direct

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download source image artifact
        uses: actions/download-artifact@v5
        with:
          name: pve-source-${{ matrix.image_id }}
          path: /tmp/pve-cloud-build/${{ matrix.image_id }}-${{ matrix.image_profile }}/source

      - name: Show source image
        run: |
          ls -lh "${SRC_IMAGE}"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libguestfs-tools \
            qemu-utils \
            wget \
            curl \
            ca-certificates

      - name: Check libguestfs backend
        run: |
          echo "LIBGUESTFS_BACKEND=${LIBGUESTFS_BACKEND}"
          sudo env LIBGUESTFS_BACKEND="${LIBGUESTFS_BACKEND}" libguestfs-test-tool

      - name: Build image
        run: |
          chmod +x ./build-pve-cloud-image.sh
          ./build-pve-cloud-image.sh

      - name: Show output files
        run: |
          ls -lh "${WORKDIR}"
          cat "${WORKDIR}"/*.sha256

      - name: Collect release files
        run: |
          mkdir -p "${WORKDIR}/dist"
          final_qcow2="$(find "${WORKDIR}" -maxdepth 1 -type f -name '*.qcow2' ! -name '*-src.qcow2' ! -name '*-work.qcow2' -print -quit)"
          if [ -z "${final_qcow2}" ]; then
            echo "::error::未找到最终 qcow2 镜像文件"
            exit 1
          fi
          final_sha256="${final_qcow2}.sha256"
          if [ ! -f "${final_sha256}" ]; then
            echo "::error file=${final_qcow2}::未找到 SHA256 校验文件"
            exit 1
          fi
          cp "${final_qcow2}" "${final_sha256}" "${WORKDIR}/dist/"
          ls -lh "${WORKDIR}/dist"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-${{ matrix.image_profile }}
          path: |
            ${{ env.WORKDIR }}/dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Generate release metadata
        id: meta
        run: |
          release_date="$(TZ=Asia/Shanghai date +'%Y.%m.%d')"
          echo "release_date=${release_date}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=pve-cloud-templates-${release_date}" >> "${GITHUB_OUTPUT}"
          echo "release_name=PVE Cloud Templates ${release_date}" >> "${GITHUB_OUTPUT}"

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: "*-pve-cloud-template-*"
          merge-multiple: true

      - name: Show release files
        run: |
          find dist -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Check GitHub Release asset size limit
        run: |
          max_bytes=$((2 * 1024 * 1024 * 1024))
          failed=0
          for file in dist/*.qcow2; do
            size="$(stat -c '%s' "${file}")"
            if [ "${size}" -ge "${max_bytes}" ]; then
              echo "::error file=${file}::GitHub Release 单个附件必须小于 2 GiB，当前文件大小为 ${size} bytes。"
              failed=1
            fi
          done
          exit "${failed}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_name }}
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            PVE Cloud Templates 自动构建版本。

            构建日期：${{ steps.meta.outputs.release_date }}
            镜像档位：minimal + common

            包含镜像：
            - Debian 12 genericcloud amd64 minimal/common
            - Debian 13 genericcloud amd64 minimal/common
            - Ubuntu 22.04 LTS cloudimg amd64 minimal/common
            - Ubuntu 24.04 LTS cloudimg amd64 minimal/common
            - Ubuntu 26.04 LTS cloudimg amd64 minimal/common

            默认策略：
            - 保留官方 cloud/virtual kernel
            - 不内置默认 root 密码
            - root 登录由 PVE cloud-init 注入的密码或 SSH key 决定
            - minimal 只安装 PVE/cloud-init 基础组件
            - common 额外安装常用排障和运维工具
            - Docker、TCP 窗口调优 / BBR 只在 common 档位生效
            - Speedtest CLI 只在 Debian 13 common 档位生效

            common 可选功能：
            - 安装 Docker CE：${{ inputs.install_docker }}
            - Debian 13 安装 Speedtest CLI：${{ inputs.install_speedtest }}
            - 启用 TCP 调优和 BBR sysctl 配置：${{ inputs.enable_bbr }}
            - 构建时应用系统更新：${{ inputs.apply_updates }}

            安全提醒：镜像不包含默认密码。克隆 VM 时请通过 cloud-init 注入 SSH 公钥，或按需注入 root 密码。
          files: |
            dist/*.qcow2
            dist/*.sha256
